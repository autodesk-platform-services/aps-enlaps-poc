[project]
name = "aps-ssa"
version = "0.1.0"
description = "Service Account Authentication (SSA) client for Autodesk Platform Services"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyjwt[crypto]>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aps_ssa"]
