[project]
name = "aps-forma-issues"
version = "0.1.0"
description = "Create Autodesk Forma/ACC Issues with an attached image"
requires-python = ">=3.11"
dependencies = [
    "pyjwt>=2.13.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aps_forma_issues"]
